name: Build APK

# Runs automatically on every push to main, and can also be triggered manually
# from the Actions tab (useful from the GitHub mobile app / mobile browser).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate the Gradle wrapper
        # The repo doesn't carry the wrapper jar (binary files don't upload cleanly
        # from a phone), so the runner creates it fresh using whatever Gradle it has preinstalled.
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
